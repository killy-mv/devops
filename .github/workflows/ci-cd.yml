# CI/CD demo pipeline for CI-CD/demo (see CI-CD/README.md)
name: CI-CD demo

on:
  push:
    branches: [main]
    paths:                           # ignore pushes that don't touch the demo
      - "CI-CD/**"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    paths:
      - "CI-CD/**"
      - ".github/workflows/ci-cd.yml"
  workflow_dispatch:                 # "Run workflow" button in the Actions tab

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/bakery

jobs:
  # ── CI: is the code OK? Runs on every push and pull request ──
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CI-CD/demo
    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

  # ── CD: package and ship. Only after tests pass, only on main (not PRs) ──
  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                # allow pushing to ghcr.io
    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # temporary token GitHub creates for each run

      - name: Decide image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: CI-CD/demo
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}

      - name: Summary
        run: |
          {
            echo "### Image published :rocket:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
