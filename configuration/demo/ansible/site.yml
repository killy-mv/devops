# Each play: "on THESE hosts, make sure THESE things are true"

- name: Common setup for every server
  hosts: all
  become: true                    # run tasks with sudo
  tasks:
    - name: Install common packages
      ansible.builtin.apt:
        name: "{{ common_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600    # skip `apt update` if done in the last hour

    - name: Create admin users
      ansible.builtin.user:
        name: "{{ item }}"
        groups: sudo
        append: true
        shell: /bin/bash
      loop: "{{ admin_users }}"

- name: Web servers
  hosts: webservers
  become: true
  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Deploy nginx site config
      ansible.builtin.template:
        src: nginx-site.conf.j2
        dest: /etc/nginx/sites-available/default
      notify: Reload nginx        # only runs if this task changed something

    - name: Deploy home page
      ansible.builtin.template:
        src: index.html.j2
        dest: /var/www/html/index.html

    - name: Make sure nginx is running
      ansible.builtin.service:
        name: nginx
        state: started

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

- name: Database servers
  hosts: dbservers
  become: true
  tasks:
    - name: Install PostgreSQL
      ansible.builtin.apt:
        name: postgresql
        state: present

    - name: Limit connections
      ansible.builtin.lineinfile:
        path: /etc/postgresql/{{ postgres_version }}/main/postgresql.conf
        regexp: '^#?max_connections'
        line: max_connections = 50
      notify: Restart PostgreSQL     # this setting only applies after a restart

    - name: Make sure PostgreSQL is running
      ansible.builtin.service:
        name: postgresql
        state: started

  handlers:
    - name: Restart PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: restarted
